default:
  temperature: 0.3
  timeout_seconds: 60
  max_retries_on_http_error: 1   # retry the same model, no fallback
nodes:
  planner:     { model: deepseek/deepseek-v4.1-flash, temperature: 0.2, max_tokens: 6000 }
  interviewer: { model: z-ai/glm-5.3-flash,           temperature: 0.6, max_tokens: 4000, stream: true, reasoning: { effort: low } }
  judge:       { model: deepseek/deepseek-v4.1-flash, temperature: 0.0, max_tokens: 2400 }
  scorer:      { model: deepseek/deepseek-v4.1-flash, temperature: 0.0, max_tokens: 8000 }
  authenticity: { model: deepseek/deepseek-v4.1-flash, temperature: 0.0, max_tokens: 2000 }
  fluency:      { model: deepseek/deepseek-v4.1-flash, temperature: 0.2, max_tokens: 2000 }
  rubric_suggester: { model: deepseek/deepseek-v4.1-flash, temperature: 0.3, max_tokens: 3000 }
prices:
  deepseek/deepseek-v4.1-flash: { in: 0.045, out: 0.5 }
  z-ai/glm-5.3-flash:           { in: 0.15,  out: 0.50 }
transcriber:
  model: whisper-large-v3-turbo
  usd_per_hour: 0.04
  min_billed_seconds: 10
