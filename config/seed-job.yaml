id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
title: Senior Frontend Engineer
description: |
  We are hiring a Senior Frontend Engineer to own the applicant and recruiter
  experiences of an AI-assisted hiring product. You will work across the whole
  browser: performance, rendering, state architecture, realtime updates,
  accessible interaction and the contracts that connect them to the backend.

  ## Responsibilities
  - Own Core Web Vitals for the applicant and recruiter experiences: set budgets,
    profile with Lighthouse and the browser performance panel, and ship measurable
    improvements to LCP, INP and CLS.
  - Design rendering and state architecture for a SvelteKit and TypeScript app:
    choose server rendering, hydration and client state boundaries deliberately,
    and keep components small, testable and easy to reason about.
  - Build realtime interfaces over SSE and WebSocket: reconnect cleanly, reconcile
    streamed events with cached state, and keep the UI responsive under partial
    failures.
  - Make search and filters deep-linkable: encode query, pagination and filter
    state in the URL so a recruiter can share or reload an exact view.
  - Keep the product accessible: keyboard paths, screen reader labels, focus
    management and WCAG-aware component choices are part of the definition of done.
  - Shape API contracts with backend engineers: model loading, error and retry
    states, and defend the contract with shared types and contract tests.
  - Raise the quality bar with unit, integration and end-to-end tests, and mentor
    other engineers through design reviews, pairing and code review.

  ## Requirements
  - 5+ years building production web applications, with deep TypeScript and strong
    Svelte and/or React experience.
  - A track record of diagnosing and fixing performance problems with real
    before/after measurements, not only opinions.
  - Experience designing state and rendering architecture for complex, data-heavy
    interfaces.
  - Hands-on experience with realtime UI: SSE or WebSocket, reconnection, event
    ordering and optimistic updates.
  - Experience with deep-linked search, filter and pagination state, and with the
    accessibility and testing work that makes those flows safe.
  - Clear written and verbal communication; you can explain trade-offs and mentor
    teammates.
